<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#131c26"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5bc0f0"/>
      <stop offset="1" stop-color="#2b83c9"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3ba9e0" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#3ba9e0" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="round"><rect x="0" y="0" width="1200" height="300" rx="26"/></clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect x="0" y="0" width="1200" height="300" fill="url(#bg)"/>
    <circle cx="1060" cy="60" r="320" fill="url(#glow)"/>
    <rect x="0" y="0" width="8" height="300" fill="url(#accent)"/>
    <!-- subtle grid dots -->
    <g fill="#ffffff" opacity="0.04">
      <circle cx="120" cy="40" r="2"/><circle cx="200" cy="40" r="2"/><circle cx="280" cy="40" r="2"/>
      <circle cx="160" cy="70" r="2"/><circle cx="240" cy="70" r="2"/>
    </g>

    <!-- title -->
    <text x="64" y="128" font-size="76" font-weight="800" fill="#ffffff" letter-spacing="-1">SimpleLife</text>
    <text x="70" y="168" font-size="25" font-weight="600" fill="#8fb4cf">Framework RP FiveM &#183; maison</text>
    <text x="70" y="199" font-size="15" fill="#5f7688">lean&#8209;core &#183; NUI Liquid Glass &#183; server&#8209;authoritative</text>

    <!-- system chips -->
    <g font-size="15" fill="#cfe0ec" text-anchor="middle">
      <g>
        <rect x="64"  y="232" width="132" height="38" rx="19" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.14"/>
        <text x="130" y="257">Téléphone</text>
      </g>
      <g>
        <rect x="206" y="232" width="150" height="38" rx="19" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.14"/>
        <text x="281" y="257">Sociétés LTD</text>
      </g>
      <g>
        <rect x="366" y="232" width="176" height="38" rx="19" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.14"/>
        <text x="454" y="257">Concessionnaire</text>
      </g>
      <g>
        <rect x="552" y="232" width="172" height="38" rx="19" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.14"/>
        <text x="638" y="257">Inventaire poids</text>
      </g>
      <g>
        <rect x="734" y="232" width="158" height="38" rx="19" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.14"/>
        <text x="813" y="257">HUD &amp; besoins</text>
      </g>
    </g>

    <!-- glass emblem -->
    <g transform="translate(1004,92)">
      <rect x="0" y="0" width="116" height="116" rx="28" fill="url(#accent)"/>
      <rect x="0" y="0" width="116" height="58" rx="28" fill="#ffffff" opacity="0.18"/>
      <rect x="6" y="6" width="104" height="104" rx="24" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="1.5"/>
      <text x="58" y="76" font-size="46" font-weight="800" fill="#ffffff" text-anchor="middle">SL</text>
    </g>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="299" rx="26" fill="none" stroke="#ffffff" stroke-opacity="0.10"/>
</svg>
